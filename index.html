<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><title>Preventa • Distribuidores del Castillo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f1f5f9;color:#0f172a;padding-bottom:70px}header{background:#0f172a;color:white;padding:15px;position:sticky;top:0;z-index:2}main{max-width:900px;margin:auto;padding:12px}.view{display:none}.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:10px}.metric b{font-size:23px;display:block}small,label{color:#64748b}.row,.actions{display:flex;gap:8px}.row>*{flex:1}input,select,button{width:100%;padding:11px;border-radius:9px;border:1px solid #cbd5e1;font:inherit}button{background:#0f172a;color:white;border:0;font-weight:700}.green{background:#16a34a}.red{background:#dc2626}.secondary{background:#e2e8f0;color:#0f172a}.progress{height:12px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar{height:100%;background:#2563eb;width:0}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}.total{font-size:23px;font-weight:800;margin-top:10px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;z-index:5}nav button{background:white;color:#64748b;border-radius:0;font-size:11px;padding:9px 2px}nav button.active{color:#2563eb}.pill{background:#dbeafe;color:#1d4ed8;padding:3px 7px;border-radius:99px;font-size:11px}.empty{text-align:center;color:#64748b;padding:25px}
</style></head><body>
<header><b>Preventa</b><br><small>Distribuidores del Castillo</small></header><main>
<section id="inicio" class="view active"><h2>Dashboard</h2><div class="grid">
<div class="card metric"><small>Meta del día</small><b id="metaV">C$0</b></div><div class="card metric"><small>Vendido</small><b id="vendV">C$0</b></div><div class="card metric"><small>Clientes</small><b id="cliV">0</b></div><div class="card metric"><small>Con pedido</small><b id="pedV">0</b></div></div>
<div class="card"><b>Avance</b><p id="pct">0%</p><div class="progress"><div id="bar" class="bar"></div></div><p><small>Efectividad: <b id="efec">0%</b></small></p></div>
<button onclick="go('preventa')">+ NUEVA PREVENTA</button></section>

<section id="clientes" class="view"><h2>Clientes</h2><div class="card"><input id="buscar" placeholder="Buscar cliente" oninput="clientes()"></div><div id="listaClientes"></div></section>

<section id="preventa" class="view"><h2>Nueva preventa</h2><div class="card"><label>Cliente</label><select id="oc"></select><label>Descuento %</label><input id="od" type="number" value="0"><label>Producto</label><select id="op"></select><div class="row"><div><label>Presentación</label><select id="ou"><option>Unidad</option><option>Docena</option><option>Caja</option></select></div><div><label>Cantidad</label><input id="oq" type="number" min="1" value="1"></div></div><br><button onclick="add()">Agregar</button></div>
<div class="card"><h3>Detalle</h3><div id="car"></div><div class="total" id="ot">C$0.00</div><br><button class="green" onclick="firmar()">PONER EN FIRME Y GUARDAR</button></div></section>

<section id="picking" class="view"><h2>Consolidado / Picking</h2><div class="card"><button onclick="picking()">Actualizar</button></div><div class="card" id="pick"></div></section>
<section id="historial" class="view"><h2>Historial</h2><div id="hist"></div></section>
<section id="config" class="view"><h2>Configuración</h2><div class="card"><label>Meta diaria C$</label><input id="meta" type="number" onchange="saveMeta()"></div><div class="card"><h3>Productos</h3><div id="prod"></div><button onclick="nuevoProducto()">+ Producto</button></div><div class="card"><button class="red" onclick="resetAll()">Borrar todos los datos</button></div></section>
</main>
<nav><button class="active" onclick="go('inicio',this)">🏠<br>Inicio</button><button onclick="go('clientes',this)">👥<br>Clientes</button><button onclick="go('preventa',this)">🛒<br>Preventa</button><button onclick="go('picking',this)">📦<br>Picking</button><button onclick="go('historial',this)">🧾<br>Historial</button></nav>
<script>
const K='pdc_pwa_v1';let db=JSON.parse(localStorage.getItem(K)||'null')||{meta:25000,clients:[['Pulpería La Bendición','Lunes',0,0],['Pulpería El Progreso','Martes',2,0],['Distribuidora San José','Miércoles',3,5000],['Pulpería La Esquina','Jueves',0,0],['Mini Súper Central','Viernes',2,10000]],products:[['Coca Cola 3 L',55,630,1260],['Arroz 5 lb',85,960,1900],['Aceite 1 L',70,780,1500],['Frijoles 1 lb',45,500,980],['Big Cola 3 L',42,480,900],['Leche Eskimo',35,390,750]],orders:[]};let cart=[];const save=()=>localStorage.setItem(K,JSON.stringify(db)),money=n=>'C$ '+(+n).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function go(id,b){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(id==='clientes')clientes();if(id==='preventa')form();if(id==='picking')picking();if(id==='historial')historial();if(id==='config')config();dashboard()}
function dashboard(){let d=new Date().toISOString().slice(0,10),o=db.orders.filter(x=>x.date===d),v=o.reduce((a,x)=>a+x.total,0),u=new Set(o.map(x=>x.client)).size,p=db.meta?v/db.meta*100:0;metaV.textContent=money(db.meta);vendV.textContent=money(v);cliV.textContent=db.clients.length;pedV.textContent=u;pct.textContent=Math.min(100,p).toFixed(1)+'%';bar.style.width=Math.min(100,p)+'%';efec.textContent=(db.clients.length?u/db.clients.length*100:0).toFixed(1)+'%'}
function clientes(){let q=(buscar.value||'').toLowerCase();listaClientes.innerHTML=db.clients.map((c,i)=>[c,i]).filter(x=>x[0][0].toLowerCase().includes(q)).map(x=>{let c=x[0],i=x[1];return `<div class="card"><b>${esc(c[0])}</b> <span class="pill">${c[1]}</span><p>Descuento ${c[2]}% · Crédito ${money(c[3])}</p><div class="actions"><button onclick="editarCliente(${i})">Editar</button><button class="red" onclick="baja(${i})">Dar de baja</button></div></div>`}).join('')||'<div class="empty">No hay clientes.</div>'}
function editarCliente(i){let c=db.clients[i];c[0]=prompt('Nombre',c[0])??c[0];c[1]=prompt('Día',c[1])||c[1];c[2]=+(prompt('Descuento %',c[2])||c[2]);c[3]=+(prompt('Crédito C$',c[3])||c[3]);save();clientes()}
function baja(i){if(confirm('¿Dar de baja?')){db.clients.splice(i,1);save();clientes();dashboard()}}
function form(){oc.innerHTML=db.clients.map((c,i)=>`<option value="${i}">${esc(c[0])}</option>`).join('');op.innerHTML=db.products.map((p,i)=>`<option value="${i}">${esc(p[0])}</option>`).join('');od.value=db.clients[0]?.[2]||0;renderCart()}
oc.onchange=()=>od.value=db.clients[oc.value]?.[2]||0;od.oninput=renderCart;
function add(){let p=db.products[op.value],u=ou.value,q=Math.max(1,+oq.value||1),price=u==='Unidad'?p[1]:u==='Docena'?p[2]:p[3];cart.push({name:p[0],unit:u,qty:q,price});renderCart()}
function renderCart(){let s=cart.reduce((a,x)=>a+x.qty*x.price,0),d=+od.value||0;car.innerHTML=cart.length?'<table><tr><th>Producto</th><th>Cant.</th><th>Total</th><th></th></tr>'+cart.map((x,i)=>`<tr><td>${esc(x.name)}<br><small>${x.unit}</small></td><td>${x.qty}</td><td>${money(x.qty*x.price)}</td><td><button class="red" onclick="cart.splice(${i},1);renderCart()">×</button></td></tr>`).join('')+'</table>':'<div class="empty">Agregá productos.</div>';ot.textContent=money(s*(1-d/100))}
function firmar(){if(!cart.length)return alert('Agregá productos');let c=db.clients[oc.value],s=cart.reduce((a,x)=>a+x.qty*x.price,0),d=+od.value||0;db.orders.push({date:new Date().toISOString().slice(0,10),client:c[0],discount:d,subtotal:s,total:s*(1-d/100),lines:cart.map(x=>({...x}))});save();cart=[];renderCart();alert('Pedido guardado en firme');go('historial')}
function picking(){let m={};db.orders.forEach(o=>o.lines.forEach(l=>{let k=l.name+'|'+l.unit;if(!m[k])m[k]={n:l.name,u:l.unit,q:0};m[k].q+=l.qty}));pick.innerHTML=Object.values(m).length?'<table><tr><th>Producto</th><th>Presentación</th><th>Cantidad</th></tr>'+Object.values(m).map(x=>`<tr><td>${esc(x.n)}</td><td>${x.u}</td><td><b>${x.q}</b></td></tr>`).join('')+'</table>':'<div class="empty">No hay pedidos.</div>'}
function historial(){hist.innerHTML=[...db.orders].reverse().map((o,i)=>`<div class="card"><b>${esc(o.client)}</b><p>${o.date} · Descuento ${o.discount}%</p><div class="total">${money(o.total)}</div><details><summary>Productos</summary><ul>${o.lines.map(x=>`<li>${x.qty} ${x.unit} — ${esc(x.name)}</li>`).join('')}</ul></details></div>`).join('')||'<div class="empty">No hay pedidos.</div>'}
function config(){meta.value=db.meta;prod.innerHTML=db.products.map((p,i)=>`<div class="card"><b>${esc(p[0])}</b><br>Unidad ${money(p[1])} · Docena ${money(p[2])} · Caja ${money(p[3])}<br><br><button onclick="editarProducto(${i})">Editar</button></div>`).join('')}
function saveMeta(){db.meta=+meta.value||0;save();dashboard()}
function nuevoProducto(){let n=prompt('Producto');if(!n)return;db.products.push([n,+prompt('Unidad','0'),+prompt('Docena','0'),+prompt('Caja','0')]);save();config()}
function editarProducto(i){let p=db.products[i];p[0]=prompt('Nombre',p[0])||p[0];p[1]=+prompt('Unidad',p[1]);p[2]=+prompt('Docena',p[2]);p[3]=+prompt('Caja',p[3]);save();config()}
function resetAll(){if(confirm('¿Borrar todos los datos?')){localStorage.removeItem(K);location.reload()}}
dashboard();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
